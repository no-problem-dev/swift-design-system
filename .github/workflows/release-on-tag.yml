# SSOT: swift-oss-doctor/templates/workflows/release-on-tag.yml
#
# タグが push されたら GitHub Release を作る。それだけ。
#
# **ビルドもテストも走らせない。** 検証は手元で済ませてから push する運用にした。
# macOS ランナーのキューが実測で 10 分超あり、そのうえ依存の解決とビルドが乗るので、
# CI に検証を置くと「速く回す」ことと両立しない。単独開発のポートフォリオでは、
# 手元で build/test を通してから出す方が速く、確実性も落ちない。
#
# 版は scripts/release.sh が公開 API の実差分から計算して CHANGELOG に刻印済み。
# ここは刻まれた版を読み、その節をリリースノートにするだけの薄い層。
#
# 手編集せず distribute-workflows.sh で再配布する。
name: Release on Tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 版番号を正規表現に埋めるので 2 つ手当てする。
          #
          # 1. ドットをエスケープする。素のままだと `.` がワイルドカードになる
          # 2. 末尾に境界を置く。**前方一致のままだと 1.0.1 が 1.0.17 に当たる。**
          #    しかも awk は上から順に拾うので、降順の CHANGELOG では
          #    1.0.17 の節を開いて 1.0.2 の見出しで閉じ、そのあと 1.0.1 でまた開く。
          #    結果、1.0.1 のリリースノートに 1.0.17 の内容が混ざって公開されていた
          ESC=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[?${ESC}\\]?([^0-9.]|\$)/{flag=1; next} /^## \\[?[0-9]/{flag=0} flag" CHANGELOG.md > /tmp/notes.md
          fi
          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
