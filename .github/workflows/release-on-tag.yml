# SSOT: swift-oss-doctor/templates/workflows/release-on-tag.yml
#
# タグが push されたら GitHub Release を作る。それだけ。
#
# **ビルドもテストも走らせない。** 検証は手元で済ませてから push する運用にした。
# macOS ランナーのキューが実測で 10 分超あり、そのうえ依存の解決とビルドが乗るので、
# CI に検証を置くと「速く回す」ことと両立しない。単独開発のポートフォリオでは、
# 手元で build/test を通してから出す方が速く、確実性も落ちない。
#
# 版は scripts/release.sh が公開 API の実差分から計算して CHANGELOG に刻印済み。
# ここは刻まれた版を読み、その節をリリースノートにするだけの薄い層。
#
# 手編集せず distribute-workflows.sh で再配布する。
name: Release on Tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?${VERSION}/{flag=1; next} /^## \[?[0-9]/{flag=0} flag" CHANGELOG.md > /tmp/notes.md
          fi
          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
